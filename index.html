<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vivienda en España</title>
<meta name="description" content="Datos de vivienda de cada lugar de España, de la comunidad autónoma a la sección censal: viviendas turísticas, alquiler, vacías, segunda residencia y construcción.">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="estilo.css">
<script src="lib/leaflet.js" defer></script>
<script src="csv.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="cabecera">
  <a class="marca" href="#/">Vivienda en España</a>
  <div class="buscador" role="search">
    <label for="buscar" class="oculto">Buscar un lugar</label>
    <input id="buscar" type="search" placeholder="Busca un municipio, una provincia o un código" autocomplete="off"
           role="combobox" aria-expanded="false" aria-controls="resultados" aria-autocomplete="list">
    <ul id="resultados" role="listbox" hidden></ul>
  </div>
  <a class="enlace-fuentes" href="#/fuentes">Fuentes</a>
</header>
<nav id="pestanas" class="pestanas" role="tablist" aria-label="Temas"></nav>

<main class="cuerpo">
  <section id="cabeza" class="zona-cabeza" aria-live="polite">
    <p class="cargando">Cargando…</p>
  </section>

  <section class="zona-mapa" aria-label="Mapa">
    <div class="controles-mapa">
      <div id="capas" class="capas" hidden></div>
    </div>
    <div id="mapa"></div>
    <div id="leyenda" class="leyenda"></div>
  </section>

  <section id="ficha" class="zona-ficha" aria-live="polite"></section>
</main>

<a id="ir-ficha" class="ir-ficha" href="#ficha" hidden>Ver la ficha</a>
<noscript><p class="aviso-prueba">Esta página necesita JavaScript para enseñar el mapa y las fichas. Las tablas se pueden descargar en la carpeta datos/descargas/.</p></noscript>
</body>
</html>
